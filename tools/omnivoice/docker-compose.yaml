name: omnivoice-proxy

services:
  omnivoice-proxy:
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: omnivoice-proxy
    # Published rather than network_mode: host, which is Linux-only and silently
    # does nothing on Docker Desktop. The default binds to all interfaces so the
    # proxy is reachable from the Utsuwa dev container and other LAN devices.
    # Change to "127.0.0.1:8881:8881" if you only need local access.
    ports:
      - "8881:8881"
    ipc: host
    shm_size: "2g"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - omnivoice-cache:/data/hf_cache
    restart: unless-stopped

volumes:
  omnivoice-cache:
